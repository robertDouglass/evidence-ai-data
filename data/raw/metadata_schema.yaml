# EvidenceAI Unified Metadata Schema (v2, 2025-11-22)
# Applies to all sources: BMZ, GIZ, KfW, DEval, PTB, BGR, IKI, UN SDG, UNDP, OECD, World Bank, and others.
# Page-level fields inherit document metadata; see ingestion/INGESTION_PLAN.md for page schema.

metadata_schema:
  version: "2.0"
  description: "Unified document-level schema for ingestion → MinIO → Vespa/OpenSearch"

  required_fields:
    - doc_id
    - source
    - title
    - publication_year
    - document_type
    - language
    - local_path
    - file_hash_sha256

  field_definitions:
    doc_id:
      type: string
      description: Stable, globally unique document ID (e.g., BMZ-EVAL-2024-0521)
      validation: Unique across corpus

    source:
      type: string
      description: Source organisation/agency
      enum: ["BMZ", "GIZ", "KfW", "DEval", "PTB", "BGR", "IKI", "UNDP", "OECD", "World Bank", "UN SDG", "Other"]

    title:
      type: string
      description: English title (translate if needed)

    subtitle:
      type: string
      description: Optional subtitle/series

    original_url:
      type: string
      format: uri
      description: Landing/download URL

    local_path:
      type: string
      description: Relative path under data/raw/<source>/documents/...
      examples: ["documents/2025/ABC.pdf", "documents/climate/WB-CLIM-D123.pdf"]

    file_hash_sha256:
      type: string
      description: SHA-256 of the binary

    file_size_bytes:
      type: integer
      description: File size in bytes

    mime_type:
      type: string
      description: e.g., application/pdf

    downloaded_at:
      type: string
      format: date-time
      description: When the binary was downloaded

    publication_date:
      type: string
      format: date
      description: YYYY-MM-DD if available

    publication_year:
      type: integer
      description: Year of publication

    timeframe_start:
      type: string
      format: date
      description: Start date of coverage (optional)

    timeframe_end:
      type: string
      format: date
      description: End date of coverage (optional)

    document_type:
      type: string
      description: Controlled doc type
      enum: ["evaluation", "policy_brief", "technical_report", "research_paper", "annual_report", "assessment", "impact_report", "concept_note", "synthesis", "publication", "other"]

    thematic_area:
      type: string
      description: Primary thematic area
      enum: [
        "Climate & Energy Resilience",
        "Sustainable Infrastructure & Finance",
        "Governance, Peace & Justice",
        "Natural Resources & Biodiversity",
        "Human Development & Social Protection",
        "Quality Infrastructure & Standards",
        "Other"
      ]

    sector_tags:
      type: array
      items: string
      description: Additional sector/industry tags

    sdg_tags:
      type: array
      items: string
      description: SDG tags (use SDG1–SDG17)

    keywords:
      type: array
      items: string
      description: Freeform keywords

    countries:
      type: array
      items: string
      description: ISO 3166-1 alpha-2 codes or country names

    regions:
      type: array
      items: string
      description: Controlled: ["SSA", "MENA", "APAC", "EUR", "LAC", "NA", "Global", "Multi"]

    admin1:
      type: array
      items: string
      description: Optional first-level admin areas

    language:
      type: string
      description: ISO 639-1 language code
      enum: ["en", "de", "fr", "es", "pt", "ar", "zh", "other"]

    alt_languages:
      type: array
      items: string
      description: Additional languages present

    organisation:
      type: string
      description: Publishing organisation (if different from source)

    implementing_partners:
      type: array
      items: string
      description: Implementing partners list

    authors:
      type: array
      items: string
      description: Authors/contributors (anonymize if needed)

    license:
      type: string
      description: License descriptor (e.g., CC-BY-4.0, CC-BY-3.0-IGO, © Organisation - Attribution Required)

    page_count:
      type: integer
      description: Number of pages

    word_count:
      type: integer
      description: Word count if available

    image_count:
      type: integer
      description: Optional images/figures count

    text_extracted:
      type: boolean
      description: Text/OCR extraction complete?

    extraction_quality:
      type: string
      enum: ["excellent", "good", "fair", "poor", "unknown"]
      description: Quality assessment of extraction

    pii_flag:
      type: boolean
      description: Potential PII present?

    restricted:
      type: boolean
      description: Should be excluded from default search?

    exclude_from_search:
      type: boolean
      description: Force exclusion from indexing/results

    quality_checked:
      type: boolean
      description: Passed QA checklist?

    executive_summary:
      type: string
      description: 200–500 word summary

    abstract:
      type: string
      description: Longer abstract (100–1000 words)

    notes:
      type: string
      description: Additional notes/comments

    related_ids:
      type: array
      items: string
      description: Related doc_ids (translations, companions)

    bilingual_of:
      type: string
      description: doc_id of canonical if this is a translation

    processed_date:
      type: string
      format: date-time
      description: Last metadata update timestamp

    version:
      type: string
      description: Metadata version

    pipeline_run_id:
      type: string
      description: Ingestion pipeline run identifier

  validation_rules:
    - doc_id must be unique across corpus
    - local_path must exist under data/raw/<source>/documents/
    - publication_year must be <= current year
    - language must be ISO 639-1; regions must use controlled list
    - sdg_tags must be from SDG1–SDG17
    - if pii_flag=true then restricted=true is recommended
